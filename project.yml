name: Forma
options:
  bundleIdPrefix: de.egler
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    FORMA_SUPABASE_URL: ""
    FORMA_SUPABASE_KEY: ""
targets:
  Forma:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Forma
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: Für Fortschrittsfotos.
        NSCameraUsageDescription: Für Fortschrittsfotos.
        ITSAppUsesNonExemptEncryption: false
        FormaSupabaseURL: $(FORMA_SUPABASE_URL)
        FormaSupabaseKey: $(FORMA_SUPABASE_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.egler.forma
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
